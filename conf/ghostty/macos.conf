macos-option-as-alt = true
background-opacity = 0.95

# Keep Rime's toggle shortcut from leaking an escape sequence to the terminal.
keybind = ctrl+shift+f12=ignore

# Forward logical Colemak chords through Ctrl-g to the multiplexer on macOS.
keybind = cmd+q=text:\x07q
keybind = cmd+w=text:\x07w
keybind = cmd+f=text:\x07f
keybind = cmd+p=text:\x07p
keybind = cmd+g=text:\x07g
keybind = cmd+a=text:\x07a
keybind = cmd+r=text:\x07r
keybind = cmd+s=text:\x07s
keybind = cmd+t=text:\x07t
keybind = cmd+d=text:\x07d
keybind = cmd+h=text:\x07h
keybind = cmd+i=text:\x07i
keybind = cmd+n=text:\x07n
keybind = cmd+e=text:\x07e
keybind = cmd+l=text:\x07l
keybind = cmd+u=text:\x07u
keybind = cmd+y=text:\x07y
keybind = cmd+z=text:\x07z
keybind = cmd+j=text:\x07j
keybind = cmd+k=text:\x07k
keybind = cmd+m=text:\x07m
keybind = cmd+x=text:\x07x
keybind = cmd+b=text:\x07b
keybind = cmd+o=text:\x07o
keybind = cmd+,=text:\x07,
keybind = cmd+.=text:\x07.
keybind = cmd+;=text:\x07;

keybind = cmd+shift+q=text:\x07Q
keybind = cmd+shift+w=text:\x07W
keybind = cmd+shift+f=text:\x07F
keybind = cmd+shift+p=text:\x07P
keybind = cmd+shift+g=text:\x07G
keybind = cmd+shift+a=text:\x07A
keybind = cmd+shift+r=text:\x07R
keybind = cmd+shift+s=text:\x07S
keybind = cmd+shift+t=text:\x07T
keybind = cmd+shift+k=text:\x07K
keybind = cmd+shift+o=text:\x07O
keybind = cmd+shift+e=text:\x07E
keybind = cmd+shift+n=text:\x07N
