# Rime schema
# encoding: utf-8

patch:
  "schema/icon": icon/pinyin.ico
  "schema/name": Pinyin (Simplified)
  switches:
    - name: full_shape
      states: [ 半, 全 ]
    - name: zh_simp
      states: [ 简, 繁 ]
    - name: ascii_mode
      states: [拼音, 英文]
      abbrev: [拼, Ａ]
  st/option_name: zh_simp
  st/opencc_config: s2t.json
  "key_binder/bindings":
    - { when: has_menu, accept: semicolon, send: 2 }
    - { accept: "Control+Shift+F12", toggle: zh_simp, when: always }
