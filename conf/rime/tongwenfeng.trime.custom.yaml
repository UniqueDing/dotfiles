# Trime custom style settings
# 该项encoding: utf-8
patch:
  "style/comment_on_top": false
  "style/round_corner": 6
  "style/vertical_gap": 3
  "style/horizontal_gap": 3
  "style/keyboard_height":  250
  "style/enter_labels":  # 定义Enter键的文本
    go: Go
    done: Done
    next: Next
    pre: Pre
    search: Search
    send: Send
    default: Enter   # 定义默认Enter键的文本
  # "preset_keys/Shift_L": {label: '⇧', functional: false, send: Shift_L}
  "preset_keys/delimiterM": {label: 'Split', text: ''''}
  "preset_keys/BackSpaceM": {label: 'BS', preview: '⇦', repeatable: true, functional: false, send: BackSpace}
  "preset_keys/Escape": {label: 'Esc', functional: false, send: Escape}
  "preset_keys/Tab": {label: 'Tab', functional: false, send: Tab}
  "preset_keys/Alt_L": {label: 'Alt', functional: false, send: Alt_L}
  "preset_keys/Control_L": {label: 'Ctrl', functional: false, send: Control_L}
  "preset_keys/Delete": {label: 'Del', functional: false, send: Delete}
  "preset_keys/Shift_LM": {label: "Shift", send: Shift_L, shift_lock: long}
  "preset_keys/Select": {label: "Sel", send: Shift_L}
  "preset_keys/Left1M": {label: '⇦', send: Control+Left}
  "preset_keys/Right1M": {label: '⇨', send: Control+Right}
  "preset_keys/Home": {label: "Home", send: Home}
  "preset_keys/End": {label: "End", send: End}
  "preset_keys/Keyboard_defaultM": {label: "Ret", send: Eisu_toggle, select: .default}
  "preset_keys/Mode_switch_CN": {toggle: ascii_mode, functional: false, send: SWITCH_CHARSET, states: [文, A]}
  "preset_keys/Mode_switch_JP": {toggle: ascii_mode, functional: false, send: SWITCH_CHARSET, states: [あ, A]}
  "preset_keys/Mode_switch_KR": {toggle: ascii_mode, functional: false, send: SWITCH_CHARSET, states: [한, A]}
  "preset_keys/Mode_zhsimp": {toggle: zh_simp, functional: false, send: SWITCH_CHARSET, states: [简, 繁]}
  "preset_keys/Mode_kata": {toggle: kata, functional: false, send: SWITCH_CHARSET, states: [ひ, カ]}
  "preset_keys/Schema_switch": {label: 🌐, functional: false, send: MENU}
  "preset_keys/Bing": {label: ⌕, send: function, command: run, option: "https://bing.com/search?q=%4$s"}
  "preset_keys/Page_Down": {label: ⤵, send: Page_Down, functional: false}

  liquid_keyboard/fixed_key_bar:
    position: left
    keys: 
      - space1
      - BackSpace
      - Return2
      - liquid_keyboard_exit
      - liquid_keyboard_tabs

  tool_bar:
    button_spacing: 5 # 按钮间距
    button_font: iconfont.ttf # 按钮字体

    hide_button: &hide_button
      foreground:
        style: "ic@keyboard_close"
        fg_normal: candidate_text_color
      action: Hide

    emoji_button: &emoji_button
      foreground:
        style: "ic@emoticon"
      action: liquid_keyboard_emoji

    clipboard_button: &clipboard_button
      foreground:
        style: "ic@clipboard"
      action: clipboard_window

    redo_button: &redo_button
      foreground:
        style: "ic@redo"
      action: redo

    undo_button: &undo_button
      foreground:
        style: "ic@undo"
      action: undo

    scheme_button: &scheme_button
      foreground:
        style: "ic@web"
      action: Schema_switch

    theme_button: &theme_button
      foreground:
        style: "ic@tshirt-crew"
      action: Color_switch

    # 右侧按钮列表（从右向左排列）
    buttons: [ *redo_button, *undo_button, *theme_button, *clipboard_button, *emoji_button, *scheme_button, *hide_button ]

  "preset_keyboards/default":
    author: "UniqueDing"
    name: 26 default cn
    __include: local/10keys
    __patch:
      "keys/@50/click": Mode_switch_CN
      "keys/@50/long_click": Mode_zhsimp

  "preset_keyboards/japanese":
    author: "UniqueDing"
    name: 26 japanese
    __include: local/10keys
    __patch:
      "keys/@50/click": Mode_switch_JP
      "keys/@50/long_click": Mode_kata

  "preset_keyboards/KappaJP":
    author: "UniqueDing"
    name: 26 KappaJP
    __include: local/10keys
    __patch:
      "keys/@50/click": Mode_switch_JP
      "keys/@50/long_click": Mode_kata

  "preset_keyboards/hangeul2set":
    author: "UniqueDing"
    name: 26 hangeul2set
    __include: local/10keys
    __patch:
      "keys/@13/label": ㅂ
      "keys/@14/label": ㅈ
      "keys/@15/label": ㄷ
      "keys/@16/label": ㄱ
      "keys/@17/label": ㅅ
      "keys/@18/label": ㅛ
      "keys/@19/label": ㅕ
      "keys/@20/label": ㅑ
      "keys/@21/label": ㅐ

      "keys/@25/label": ㅁ
      "keys/@26/label": ㄴ
      "keys/@27/label": ㅇ
      "keys/@28/label": ㄹ
      "keys/@29/label": ㅎ
      "keys/@30/label": ㅗ
      "keys/@31/label": ㅓ
      "keys/@32/label": ㅏ
      "keys/@33/label": ㅣ
      "keys/@34/label": ㅔ

      "keys/@38/label": ㅋ
      "keys/@39/label": ㅌ
      "keys/@40/label": ㅊ
      "keys/@41/label": ㅍ
      "keys/@42/label": ㅠ
      "keys/@43/label": ㅜ
      "keys/@44/label": ㅡ
      "keys/@50/click": Mode_switch_KR
      "keys/@50/long_click": ""

  "preset_keyboards/number":
    author: "uniqueding"
    name: 數字
    width: 12
  # height: 48
    ascii_mode: 1
    reset_ascii_mode: false
    keys:
      - {click: 1, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: 2, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: 3, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: '+', long_click: '±', swipe_down: '±', key_text_size: 20, key_back_color: bgn, key_text_color: tgn, key_text_offset_y: 5}
      - {click: Left1M, long_click: Home, key_text_offset_y: 5}
      - {click: Up}
      - {click: Right1M, long_click: End, key_text_offset_y: 5}
      - {width: 10, key_back_color: bh2, key_text_color: th2}

      - {click: 4, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: 5, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: 6, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: '-', long_click: '_', swipe_down: '_', key_text_size: 20, key_back_color: bgn, key_text_color: tgn, key_text_offset_y: 5}
      - {click: Left}
      - {click: Select}
      - {click: Right}
      - {width: 10, key_back_color: bh2, key_text_color: th2}

      - {click: 7, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: 8, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: 9, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: '*', long_click: '^', swipe_down: '^', key_text_size: 20, key_back_color: bgn, key_text_color: tgn, key_text_offset_y: 5}
      - {click: '=', long_click: '≠', swipe_down: '≠', key_text_size: 20, key_back_color: bgn, key_text_color: tgn, key_text_offset_y: 5}
      - {click: Down}
      - {click: BackSpaceM, key_back_color: bbs, key_text_color: tbs}
      - {width: 10, key_back_color: bh2, key_text_color: th2}

      - {click: Return, width: 14, key_back_color: benter, key_text_color: tenter}
      - {click: 0, width: 14, key_back_color: key_back_color, key_text_color: key_text_color}
      - {click: '.', width: 14, long_click: ',', swipe_down: ',', key_back_color: bgn, key_text_color: tgn}
      - {click: '/', long_click: '%', swipe_down: '%', key_text_size: 20, key_back_color: bgn, key_text_color: tgn, key_text_offset_y: 5}
      - {click: ':', long_click: copy, label_symbol: '❐', key_text_size: 20, key_back_color: bgn, key_text_color: tgn, key_text_offset_y: 5}
      - {click: space, long_click: paste_clip, label_symbol: '▣', key_back_color: bgn, key_text_color: tgn}
      - {click: Keyboard_defaultM, label: 'Back', key_back_color: bgn, key_text_color: 'tgn'}
      - {width: 10, key_back_color: bh2, key_text_color: th2}

      - {height: 10, width: 100}


  preset_color_schemes:
    fira_dark:
      # 顏色定義
      1: &fira_dark_color1 0xffF1F1F1 # 主要文本色
      2: &fira_dark_color2 0xff393c3f # 主要按鍵背景色
      3: &fira_dark_color3 0xff000000 # 主要背景色
      4: &fira_dark_color4 0xff676767 # 功能鍵背景色
      6: &fira_dark_color5 0xff2472e1 # 強調背景色 
      7: &fira_dark_color6 0xff000000 # 強調文本色 
      8: &fira_dark_color7 0xffB6B6B6 # 次要文本色
      # ----------------------------------------
      name: "Fira Dark"  # 方案名稱
      author: ChiesiMario # 作者信息
      light_scheme: fira_light # 視當前為深色模式的配色。当系统切换为淺色模式后，切換至該主題
      back_color: *fira_dark_color3 # 候選區背景狀態欄
      border_color: *fira_dark_color1 # 邊框顏色
      candidate_separator_color: *fira_dark_color7 # 候選分割背景
      candidate_text_color: *fira_dark_color1 # 候選文本
      comment_text_color: *fira_dark_color7 # 提示 
      hilited_back_color: *fira_dark_color3 # 高亮編碼背景
      hilited_candidate_back_color: *fira_dark_color5 # 高亮候選背景
      hilited_candidate_text_color: *fira_dark_color6 # 高亮候選文本
      hilited_comment_text_color: *fira_dark_color7 # 高亮提示
      hilited_key_back_color: *fira_dark_color5 # 高亮按鍵背景
      hilited_key_symbol_color: *fira_dark_color6 # 高亮按鍵符號
      hilited_key_text_color: *fira_dark_color6 # 高亮按鍵文本
      hilited_off_key_back_color: *fira_dark_color5 # 高亮按鍵關閉狀態背景
      hilited_off_key_text_color: *fira_dark_color6 # 高亮按鍵關閉狀態文本
      hilited_text_color: *fira_dark_color1 # 高亮編碼
      key_back_color: *fira_dark_color2 # 按鍵背景
      key_symbol_color: *fira_dark_color7 # 按鍵符號
      key_text_color: *fira_dark_color1 # 按鍵文本
      keyboard_back_color: *fira_dark_color3 # 鍵盤背景
      label_color: *fira_dark_color5 # 標籤
      off_key_back_color: *fira_dark_color4  # 按鍵關閉狀態背景
      off_key_text_color: *fira_dark_color7 # 按鍵關閉狀態文本
      preview_back_color: *fira_dark_color4 # 按鍵提示背景
      preview_text_color: *fira_dark_color5 # 按鍵提示文本
      text_color: *fira_dark_color5 # 編碼
      text_back_color: *fira_dark_color3 # 編碼區背景
      bkg: *fira_dark_color2 # 空格鍵背景色
      tkg: *fira_dark_color1 # 空格鍵文字顏色
      benter: *fira_dark_color5 # 回車鍵背景色
      tenter: *fira_dark_color6 # 回車鍵文字顏色
      bgn: *fira_dark_color4 # 功能鍵背景色
      tgn: *fira_dark_color1 # 功能鍵文字顏色
      bbs: *fira_dark_color4 # 退格鍵背景色
      tbs: *fira_dark_color1 # 退格鍵文字顏色
      baoe: *fira_dark_color2 # aoeiu 背景色
      taoe: *fira_dark_color5 # aoeiu 文字顏色
      bh1: *fira_dark_color2 # 第一行背景色
      th1: *fira_dark_color1 # 第一行文字顏色
      bh2: *fira_dark_color2 # 第二行背景色
      th2: *fira_dark_color1 # 第二行文字顏色
      bh3: *fira_dark_color2 # 第三行背景色
      th3: *fira_dark_color1 # 第三行文字顏色
      bh4: *fira_dark_color2 # 第四行背景色
      th4: *fira_dark_color1 # 第四行文字顏色

