local:
  10keys:
    width: 9
    key_text_offset_y: 1.8
    # height: 60
    ascii_mode: 0
    reset_ascii_mode: false
    keys:
      - {click: 1, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, height: 35, key_text_size: 16}
      - {click: 2, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 3, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 4, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 5, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 6, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 7, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 8, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 9, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {click: 0, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}
      - {width: 1}
      - {click: Delete, key_back_color: bh1, key_text_color: th1, key_text_offset_y: 1, key_text_size: 16}

      - {width: 100, height: 1}

      - {click: q, swipe_up: 'á', label_symbol: '!', swipe_down: '!', popup: ['😀', 'á', 'Á', '!'], key_back_color: bh1, key_text_color: th1}
      - {click: w, swipe_up: 'é', label_symbol: '@', swipe_down: '@', popup: ['😂', 'é', 'É', '@'], key_back_color: bh1, key_text_color: th1}
      - {click: f, swipe_up: 'è', label_symbol: '#', swipe_down: '#', popup: ['😭', 'è', 'È', '#'], key_back_color: bh1, key_text_color: th1}
      - {click: p, swipe_up: 'à', label_symbol: '$', swipe_down: '$', popup: ['😴', 'à', 'À', '$'], key_back_color: bh1, key_text_color: th1}
      - {click: g, swipe_up: 'ï', label_symbol: '%', swipe_down: '%', popup: ['🤔', 'ï', 'Ï', '%'], key_back_color: bh1, key_text_color: th1}
      - {click: j, swipe_up: 'æ', label_symbol: "'", swipe_down: "'", popup: ['😎', 'æ', 'Æ', "'"], key_back_color: bh1, key_text_color: th1}
      - {click: l, swipe_up: 'œ', label_symbol: '"', swipe_down: '"', popup: ['🌝', 'œ', 'Œ', '"'], key_back_color: bh1, key_text_color: th1}
      - {click: u, swipe_up: 'â', label_symbol: '<', swipe_down: '<', popup: ['🌚', 'â', 'Â', '<'], key_back_color: bh1, key_text_color: th1}
      - {click: y, swipe_up: 'ë', label_symbol: '>', swipe_down: '>', popup: ['👀', 'ë', 'Ë', '>'], key_back_color: bh1, key_text_color: th1}
      - {click: ';', long_click: ':', swipe_down: ':', key_back_color: bh1, key_text_color: th1}
      - {width: 1}
      - {click: Escape, key_back_color: bh1, key_text_color: th1}

      - {width: -1}
      - {click: a, swipe_up: 'ñ', label_symbol: '[', swipe_down: '[', popup: ['✅', 'ñ', 'Ñ', '['], key_back_color: bh2, key_text_color: th2}
      - {click: r, swipe_up: 'í', label_symbol: ']', swipe_down: ']', popup: ['❌', 'í', 'Í', ']'], key_back_color: bh2, key_text_color: th2}
      - {click: s, swipe_up: 'ê', label_symbol: '{', swipe_down: '{', popup: ['❓', 'ê', 'Ê', '{'], key_back_color: bh2, key_text_color: th2}
      - {click: t, swipe_up: 'ö', label_symbol: '}', swipe_down: '}', popup: ['🚨', 'ö', 'Ö', '}'], key_back_color: bh2, key_text_color: th2}
      - {click: d, swipe_up: 'ü', label_symbol: '|', swipe_down: '|', popup: ['🎉', 'ü', 'Ü', '|'], key_back_color: bh2, key_text_color: th2}
      - {click: h, swipe_up: 'ô', label_symbol: '_', swipe_down: '_', popup: ['✨', 'ô', 'Ô', '_'], key_back_color: bh2, key_text_color: th2}
