# Russian (Dictor-inspired) — physical QWERTY positions on the macOS Kanata Colemak layer.
# Rime receives the Kanata output codes shown below; each position types its paired letter.
# Top row:    Qй Wх Eу Rк Tп Yб Uг Iш Oж P; (Shift+P :)
# Home row:   Aи Sв Dе Fо Gа Hл Jн Kт Lс ;р
# Bottom row: Zя Xч Cз Vм Bд Nы Mь; comma and period pass through.
# Special: tap/release / (do not hold; hold activates Kanata's Latin layer), then type:
#   /+A э  /+S щ  /+D ф  /+F ъ  /+G ю  /+H ц  /+K ё   // /
# No [] or number-row mappings are provided. Shift produces uppercase letters.
schema:
  schema_id: russian_test
  name: Russian
  version: "2"

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: "qwfpgjluyarstdhneiozxcvbkm/QWFPGJLUYARSTDHNEIOZXCVBKM"
  delimiter: " "
  auto_select: true
  max_code_length: 0

translator:
  dictionary: russian_test
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
