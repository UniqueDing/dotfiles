unbind C-b
set -g prefix 'C-g'

set -g default-command "zsh"
set -g default-terminal "screen-256color"
set -g bell-action none

set -g mouse on
set -g history-limit 3000
set -sg escape-time 0

# -- for yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set-option -g focus-events on
set-option -sa terminal-features ',screen-256color:RGB'

set-env -g LOCALE_ARCHIVE "/usr/lib/locale/locale-archive"
set-env -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# -- display
set -g base-index 1
setw -g pane-base-index 0
# Let applications such as OpenCode set the tmux window title.
set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_title},},#{pane_current_command},#{pane_title}}'
set -g set-titles on
set -g set-titles-string '#S:#I.#P #{window_name}'

bind r run-shell "printf '\033[?1000l\033[?1002l\033[?1003l\033[?1005l\033[?1006l\033[?1015l' > '#{pane_tty}'" \; source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

bind t last-window
bind h previous-window
bind i next-window

set -g mode-keys vi

bind v copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection

bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi i send-keys -X cursor-right
bind -T copy-mode-vi e send-keys -X cursor-up
bind -T copy-mode-vi n send-keys -X cursor-down
bind -T copy-mode-vi j send-keys -X next-word-end
bind -T copy-mode-vi M-e send-keys -N 5 -X cursor-up
bind -T copy-mode-vi M-n send-keys -N 5 -X cursor-down
bind -T copy-mode-vi M-h send-keys -X start-of-line
bind -T copy-mode-vi M-i send-keys -X end-of-line
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi k send-keys -X search-again
bind -T copy-mode-vi K send-keys -X search-reverse

source-file $HOME/.config/tmux/theme/catppuccin_mocha.conf
source-file "$HOME/.config/tmux/status/status.conf"

run "${TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm"

source-file "$HOME/.config/tmux/dwm/dwm.tmux"

# One-shot tmux command-layer bindings.  Keep these after TPM so which-key
# or DWM cannot replace them, and rebind them on reload to remove stale commands.
# unbind Tab
# unbind Escape
unbind M-x
unbind M-m
unbind M-b
unbind M-w
unbind M-h
unbind M-i
unbind M-c
unbind M-v
unbind M-k
unbind M-y
unbind M-z
unbind M-j
# bind Tab last-window
# bind Escape detach-client
bind M-x confirm-before -p 'kill-pane #P? (y/n)' kill-pane
bind M-m choose-tree -Zs
bind M-b last-window
bind M-w newpanecurdir
bind M-h previous-window
bind M-i next-window
bind M-k new-window
bind M-y copy-mode
bind M-z run-shell "printf '\033[?1000l\033[?1002l\033[?1003l\033[?1005l\033[?1006l\033[?1015l' > '#{pane_tty}'" \; source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"
bind M-j command-prompt -p find-window 'find-window "%%"'

# Authoritative prefix map. Keep this after TPM and DWM so plugin defaults
# cannot replace the cross-platform Cmd/RightCtrl + Colemak key actions.
bind -T prefix q select-window -t :1
bind -T prefix w select-window -t :2
bind -T prefix f select-window -t :3
bind -T prefix p select-window -t :4
bind -T prefix g select-window -t :5
bind -T prefix a select-window -t :6
bind -T prefix r select-window -t :7
bind -T prefix s select-window -t :8
bind -T prefix t select-window -t :9
bind -T prefix d select-window -t :0
bind -T prefix h previous-window
bind -T prefix i next-window
bind -T prefix e prevpane
bind -T prefix n nextpane
bind -T prefix l incmfact
bind -T prefix u decmfact
bind -T prefix y copy-mode
bind -T prefix z run-shell "printf '\033[?1000l\033[?1002l\033[?1003l\033[?1005l\033[?1006l\033[?1015l' > '#{pane_tty}'" \; source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"
bind -T prefix j zoom
bind -T prefix k new-window
bind -T prefix m resize-pane -Z
bind -T prefix x confirm-before -p 'kill-pane #P? (y/n)' killpane
bind -T prefix b last-window
bind -T prefix o newpanecurdir
bind -T prefix , rotateccw
bind -T prefix . rotatecw
