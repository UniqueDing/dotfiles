name: Kanata Controller Linux

on:
  push:
    branches: [master]
    tags: ["kanata-controller-v*"]
    paths:
      - "kanata/controller/**"
      - ".github/workflows/kanata-controller-linux.yml"
  pull_request:
    paths:
      - "kanata/controller/**"
      - ".github/workflows/kanata-controller-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanata-controller-linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.97.1"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    # Keep glibc <= 2.35; Deepin 25 currently provides glibc 2.38.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: kanata/controller
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/kanata-controller-target
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/gcc
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component rustfmt --component clippy --target "$TARGET"

      - name: Read version and validate release tag
        id: metadata
        run: |
          version="$(cargo +"$RUST_VERSION" metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kanata-controller"))')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "kanata-controller-v$version" ]]; then
            printf 'Release tag must match Cargo.toml: kanata-controller-v%s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo +"$RUST_VERSION" fmt --check

      - name: Run Clippy
        run: cargo +"$RUST_VERSION" clippy --locked --all-targets --target "$TARGET" -- -D warnings

      - name: Test controller and packaging checks
        run: |
          cargo +"$RUST_VERSION" test --locked --target "$TARGET"
          python3 -m unittest discover -s tests -p 'test_package_linux.py' -v

      - name: Build release executable
        run: cargo +"$RUST_VERSION" build --locked --release --target "$TARGET"

      - name: Verify Linux ABI and package executable
        env:
          CONTROLLER_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python3 scripts/package_linux.py \
            --binary "$CARGO_TARGET_DIR/$TARGET/release/kanata-controller" \
            --version "$CONTROLLER_VERSION" \
            --output "$RUNNER_TEMP/kanata-controller-dist" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Upload tested Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanata-controller-linux-x86_64
          path: ${{ runner.temp }}/kanata-controller-dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kanata-controller-v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanata-controller-linux-x86_64
          path: dist

      - name: Verify checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CONTROLLER_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Refusing to overwrite existing release: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --verify-tag \
            --title "kanata-controller $CONTROLLER_VERSION (Linux x86_64)" \
            --notes "Linux x86_64 GNU build, tested on Ubuntu 22.04. Maximum required glibc: 2.35. SHA256SUMS is included. Desktop tray/systemd behavior still requires native runtime verification."
